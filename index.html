<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heal commands</title>
<meta name="description" content="Every Heal command with usage and an example of how it looks in chat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f7f5; --panel:#fff; --ink:#16302b; --muted:#566b66; --line:#d5e0db;
  --teal:#1c7c6e; --teal-deep:#0f5a4f; --coral:#c53a4e; --chip:#e8f0ed;
  --d1:#313338; --d2:#2b2d31; --d3:#1e1f22; --dtext:#dbdee1; --dmuted:#949ba4; --blurple:#5865f2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--teal-deep)}
:focus-visible{outline:3px solid var(--blurple);outline-offset:2px;border-radius:4px}
code{font-family:var(--mono);font-size:.88em;background:var(--chip);padding:.1em .35em;border-radius:4px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(244,247,245,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:.7rem 1.25rem;display:flex;gap:1rem;align-items:center}
.brand{font:800 1.45rem/1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:.55rem}
.brand i{width:1.7rem;height:1.7rem;border-radius:50%;background:var(--teal);display:grid;place-items:center;color:#fff;font:800 1rem/1 var(--display);font-style:normal}
.search{flex:1;max-width:30rem;margin-left:auto;position:relative}
.search input{width:100%;font:inherit;padding:.6rem 2.6rem .6rem 1rem;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink)}
.search input::placeholder{color:#6d807b}
.search kbd{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);font:600 .75rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:.05rem .4rem;background:var(--paper)}
.menu-btn{display:none;font:600 .9rem var(--body);padding:.55rem .9rem;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--ink);cursor:pointer}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:0 1.25rem;display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:2.5rem}
.side{position:sticky;top:4.2rem;align-self:start;max-height:calc(100vh - 5rem);overflow:auto;padding:1.5rem 0 2rem}
.side h2{font:600 .85rem var(--body);color:var(--muted);margin:0 0 .5rem .6rem}
.side a{display:flex;justify-content:space-between;gap:.5rem;padding:.38rem .6rem;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem}
.side a:hover{background:var(--chip)}
.side a[aria-current=page]{background:var(--teal);color:#fff}
.side a span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.side a[aria-current=page] span{color:#d6efe9}
main{padding:1.5rem 0 5rem;min-width:0}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,26rem);gap:2.5rem;align-items:center;padding:1.5rem 0 3rem}
.hero h1{font:800 clamp(2.2rem,4.6vw,3.4rem)/1.04 var(--display);letter-spacing:-.03em;margin:0 0 1rem}
.hero p{margin:0 0 .8rem;color:var(--muted);max-width:34rem;font-size:1.05rem}
.hero p strong{color:var(--ink)}
.hero .tip{font-size:.95rem}

/* discord-style chat (used in hero and previews) */
.chat{background:var(--d1);color:var(--dtext);border-radius:12px;overflow:hidden;font:400 .95rem/1.4 "gg sans","Segoe UI",system-ui,sans-serif;box-shadow:0 18px 40px -22px rgba(15,50,44,.55)}
.chat-bar{background:var(--d2);padding:.6rem 1rem;font-weight:600;border-bottom:1px solid var(--d3);color:#f2f3f5}
.chat-bar span{color:var(--dmuted);font-weight:400;margin-right:.3rem}
.log{padding:.9rem 1rem;display:flex;flex-direction:column;gap:.9rem}
.hero .log{height:19rem;overflow:hidden;justify-content:flex-end}
.msg{display:grid;grid-template-columns:2.4rem 1fr;gap:.75rem}
.av{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:1rem;object-fit:cover}
.who{font-weight:600;color:#f2f3f5}
.who small{font-weight:400;color:var(--dmuted);font-size:.75rem;margin-left:.4rem}
.badge{background:var(--blurple);color:#fff;font:700 .62rem/1 sans-serif;padding:.18rem .3rem;border-radius:4px;margin-left:.35rem;vertical-align:.12em}
.body{min-width:0;overflow-wrap:anywhere}
.body code{background:var(--d3);color:#e3e5e8;padding:.08em .32em}
.mention{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:4px;padding:0 .15em}
.embed{margin-top:.3rem;background:var(--d2);border-left:4px solid var(--teal);border-radius:4px;padding:.6rem .8rem;max-width:30rem}
.embed b.t{display:block;color:#f2f3f5;margin-bottom:.15rem}
.narr{color:var(--dmuted);font-size:.82rem;text-align:center;font-style:italic}
.typing{color:var(--dmuted);font-size:.8rem;height:1rem;padding:0 1rem}
.compose{margin:0 1rem 1rem;background:#383a40;border-radius:8px;padding:.7rem .9rem;color:#f2f3f5;min-height:2.6rem;font-family:var(--mono);font-size:.88rem;overflow:hidden;white-space:nowrap}
.compose.empty::before{content:"Message #general";color:#8e9297;font-family:"gg sans","Segoe UI",system-ui,sans-serif;font-size:.95rem}
.caret{display:inline-block;width:2px;height:1em;background:#f2f3f5;vertical-align:-.12em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* home list */
.home h2,.sect h2{font:800 1.5rem/1.15 var(--display);letter-spacing:-.02em;margin:0 0 1rem}
.catlist{list-style:none;margin:0;padding:0;columns:2 22rem;column-gap:3rem}
.catlist li{break-inside:avoid;border-top:1px solid var(--line);padding:.85rem 0}
.catlist a{font:600 1.1rem var(--display);color:var(--ink);text-decoration:none}
.catlist a:hover{color:var(--teal)}
.catlist .n{color:var(--muted);font-size:.85rem;margin-left:.4rem}
.catlist p{margin:.15rem 0 0;color:var(--muted);font-size:.92rem}

/* category + commands */
.cat-head h1{font:800 clamp(2rem,4vw,2.8rem)/1.05 var(--display);letter-spacing:-.03em;margin:0 0 .5rem}
.need{display:inline-block;background:var(--chip);border-radius:999px;padding:.25rem .8rem;font-size:.9rem;margin:0 0 .8rem}
.intro{max-width:46rem;color:var(--muted);margin:0 0 .5rem}
.sect{margin-top:2.2rem}
.sect h2{font-size:1.25rem;margin-bottom:.4rem}
.sect .req{font-size:.9rem;color:var(--muted);margin:0 0 .6rem}
.sect .note{color:var(--muted);font-size:.93rem;margin:.2rem 0;max-width:46rem}
.cmds{list-style:none;margin:.6rem 0 0;padding:0}
.cmd{border-top:1px solid var(--line);padding:.8rem 0}
.cmd-top{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between}
.usages{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin-bottom:.25rem}
.u{font:600 .92rem var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;overflow-wrap:anywhere}
.u .pfx{color:var(--teal)}
.u .ph{color:var(--coral);font-weight:400}
.desc{margin:0;max-width:46rem}
.desc code{background:var(--chip)}
.see{flex:none;font:600 .85rem var(--body);color:var(--teal-deep);background:none;border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;cursor:pointer}
.see:hover{background:var(--chip)}
.see[aria-expanded=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
.preview{margin-top:.7rem;max-width:38rem}
.preview .chat{box-shadow:none}
.preview[hidden]{display:none}
.cap{font-size:.82rem;color:var(--muted);margin:.4rem 0 0}
.tag{font-size:.78rem;color:var(--muted);margin-left:.2rem}
.empty{padding:2rem 0;color:var(--muted)}
.more{margin-top:1rem;font:600 .9rem var(--body);padding:.5rem 1rem;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:0}
  .menu-btn{display:block}
  .side{display:none;position:static;max-height:none;padding:.8rem 0 0}
  .side.open{display:block}
  .hero{grid-template-columns:1fr}
  .top-in{flex-wrap:wrap}
  .search{max-width:none;order:3;flex-basis:100%;margin-left:0}
  .menu-btn{margin-left:auto}
  .search kbd{display:none}
  .cmd-top{flex-direction:column;gap:.5rem}
}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#" id="home-link"><i>H</i><span id="brand-name">Heal</span></a>
    <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="side">Categories</button>
    <label class="search">
      <span class="sr" style="position:absolute;left:-9999px">Search commands</span>
      <input id="q" type="search" placeholder="Search commands, e.g. ban, voice, backup" autocomplete="off">
      <kbd>/</kbd>
    </label>
  </div>
</header>

<div class="wrap">
  <nav class="side" id="side" aria-label="Command categories"></nav>
  <main id="main" tabindex="-1"><p class="empty">Loading commands…</p></main>
</div>

<script>
(function(){
"use strict";
var DATA=null, REG={}, state={cat:null,q:""};

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function md(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}
function mentions(s){return s.replace(/(@\w+|#[a-z][\w-]*)/g,function(m){return '<span class="mention">'+m+'</span>'})}
function $(id){return document.getElementById(id)}
var SAMPLES={user:"@Alex",member:"@Alex",target:"@Alex",channel:"#general",role:"@Moderator",name:"Night Crew",code:"1a4b-2ca1",
  reason:"spamming",time:"10m",duration:"10m",amount:"5",number:"5",count:"5",n:"5",limit:"5",threshold:"3",text:"hello everyone",
  message:"hello everyone",msg:"hello everyone",url:"example.com/image.png",slot:"1",category:"Voice",emoji:"🔥",prize:"Nitro",
  winners:"1",level:"10",color:"#1c7c6e",colour:"#1c7c6e",id:"123456789"};
function fill(u,pfx){
  var s=u.replace(/\[[^\]]*\]/g,"").replace(/<([^>]+)>/g,function(m,inner){
    var k=inner.split("/")[0].trim().toLowerCase().replace(/\s+/g,"");
    if(k==="message"&&/^giveaway/.test(u))return "1234567890";
    return SAMPLES[k]||k});
  s=s.replace(/@user\b/gi,"@Alex").replace(/@role\b/gi,"@Moderator").replace(/#channel\b/gi,"#general").replace(/\b([a-z]+)\/[a-z/]+\b/gi,"$1");
  return pfx+s.replace(/\s+/g," ").trim();
}
function usageHtml(u,pfx){
  var parts=esc(u).replace(/(&lt;[^&]*?&gt;|\[[^\]]*\])/g,'<span class="ph">$1</span>');
  return '<span class="u"><span class="pfx">'+esc(pfx)+'</span>'+parts+'</span>';
}

/* ---------- chat rendering ---------- */
function userMsg(text){return '<div class="msg"><img class="av" src="avatar.png" alt=""><div class="body"><div class="who">mycliq<small>Today at 4:12 PM</small></div>'+mentions(esc(text))+'</div></div>'}
function botMsg(inner){return '<div class="msg"><img class="av" src="bot-avatar.png" alt=""><div class="body"><div class="who">'+esc(DATA?DATA.bot:"Heal")+'<span class="badge">APP</span><small>Today at 4:12 PM</small></div>'+inner+'</div></div>'}
function embed(title,text){return '<div class="embed"><b class="t">'+esc(title)+'</b>'+md(text)+'</div>'}
function narr(t){return '<div class="narr">'+esc(t)+'</div>'}

/* Replies copied from the bot's code (cogs/backup.py and cogs/moderation.py). */
var REAL_SCENES={
 "backup add":[["u","-backup add Night Crew"],["b",null,"Backup success `1a4b-2ca1`"]],
 "backup list":[["u","-backup list"],["b","embed","Saved backups","`1a4b-2ca1` **Night Crew** - 24 roles, 6 categories, 31 channels - 2 minutes ago"]],
 "backup load":[["u","-backup load 1a4b-2ca1"],["n","Heal asks you to type yes to confirm."],["u","yes"],["b",null,"Loading the backup, this can take a few minutes..."],["n","When it finishes, in the first new text channel:"],["b",null,"Backup loaded"]],
 "nuke":[["u","-nuke"],["n","Heal asks you to type yes or cancel."],["u","yes"],["n","The channel is deleted and recreated, then:"],["b",null,"first"]]
};
function sceneHtml(steps){
  return steps.map(function(s){
    if(s[0]==="u")return userMsg(s[1]);
    if(s[0]==="n")return narr(s[1]);
    return botMsg(s[1]==="embed"?embed(s[2],s[3]):md(s[2]));
  }).join("");
}
function realKey(c){
  var u=c.usages[0].replace(/[<\[].*$/,"").trim();
  return REAL_SCENES[u]?u:null;
}
function previewHtml(c,catName){
  var k=realKey(c), body, cap;
  if(k){body=sceneHtml(REAL_SCENES[k]);cap="Reply text comes from the bot's code."}
  else{
    var u=c.usages[0], typed=fill(u,DATA.prefix);
    var title=DATA.prefix+u.replace(/[<\[].*$/,"").trim();
    body=userMsg(typed)+botMsg(embed(title,c.desc||"Runs "+title+"."));
    cap="Example only. It shows what to type and what the command does; the real reply may look different."
  }
  return '<div class="chat"><div class="chat-bar"><span>#</span>general</div><div class="log">'+body+'</div></div><p class="cap">'+esc(cap)+'</p>';
}

/* ---------- views ---------- */
function catByslug(s){return DATA.categories.filter(function(c){return c.slug===s})[0]}
function total(){return DATA.categories.reduce(function(n,c){return n+c.count},0)}

function renderSide(){
  $("side").innerHTML='<h2>Categories</h2>'+DATA.categories.map(function(c){
    return '<a href="#'+c.slug+'"'+(state.cat===c.slug&&!state.q?' aria-current="page"':'')+'>'+esc(c.name)+'<span>'+c.count+'</span></a>';
  }).join("");
}
function cmdHtml(c,catName,withTag){
  var id="p"+Math.random().toString(36).slice(2,9);
  REG[id]=c;
  return '<li class="cmd"><div class="cmd-top"><div><div class="usages">'+
    c.usages.map(function(u){return usageHtml(u,DATA.prefix)}).join("")+
    (withTag?'<span class="tag">'+esc(catName)+'</span>':'')+'</div>'+
    (c.desc?'<p class="desc">'+md(c.desc)+'</p>':'')+'</div>'+
    '<button class="see" aria-expanded="false" aria-controls="'+id+'">See it in chat</button></div>'+
    '<div class="preview" id="'+id+'" hidden></div></li>';
}
function renderHome(){
  var p=esc(DATA.prefix), n=total();
  $("main").innerHTML=
   '<section class="hero"><div><h1>What '+esc(DATA.bot)+' can do, and how to type it</h1>'+
   '<p><strong>'+n+' commands</strong> in '+DATA.categories.length+' categories. Search for one, open it, and see how it looks in chat.</p>'+
   '<p class="tip">The default prefix is <code>'+p+'</code>. Servers can change it, and mentioning the bot always works.</p></div>'+
   '<div class="chat" role="img" aria-label="Animated example of Heal answering backup commands in a Discord channel"><div class="chat-bar"><span>#</span>general</div>'+
   '<div class="log" id="demo-log"></div><div class="typing" id="demo-typing"></div><div class="compose empty" id="demo-in"></div></div></section>'+
   '<section class="home"><h2>Browse by category</h2><ul class="catlist">'+DATA.categories.map(function(c){
     return '<li><a href="#'+c.slug+'">'+esc(c.name)+'</a><span class="n">'+c.count+' commands</span>'+(c.intro[0]?'<p>'+md(c.intro[0])+'</p>':'')+'</li>';
   }).join("")+'</ul></section>';
  startDemo();
}
function renderCat(c){
  var h='<div class="cat-head"><h1>'+esc(c.name)+'</h1>'+(c.required?'<div class="need">Needs: '+md(c.required)+'</div>':'')+
        c.intro.map(function(t){return '<p class="intro">'+md(t)+'</p>'}).join("")+'</div>';
  h+=c.sections.map(function(s){
    return '<section class="sect"><h2>'+esc(s.title)+'</h2>'+(s.required?'<p class="req">Needs: '+md(s.required)+'</p>':'')+
      s.notes.map(function(t){return '<p class="note">'+md(t)+'</p>'}).join("")+
      '<ul class="cmds">'+s.commands.map(function(x){return cmdHtml(x,c.name,false)}).join("")+'</ul></section>';
  }).join("");
  $("main").innerHTML=h;
}
function renderSearch(q){
  var terms=q.toLowerCase().split(/\s+/).filter(Boolean), hits=[];
  DATA.categories.forEach(function(c){c.sections.forEach(function(s){s.commands.forEach(function(x){
    var hay=(x.usages.join(" ")+" "+x.desc+" "+c.name+" "+s.title).toLowerCase();
    if(terms.every(function(t){return hay.indexOf(t)>-1})){
      var first=x.usages[0].toLowerCase(), uh=x.usages.join(" ").toLowerCase();
      var score=first.indexOf(terms[0])===0?0:(uh.indexOf(terms[0])>-1?1:2);
      hits.push([x,c.name,score]);
    }
  })})});
  hits.sort(function(a,b){return a[2]-b[2]});
  var cap=100, shown=hits.slice(0,cap);
  $("main").innerHTML='<div class="cat-head"><h1>Results for “'+esc(q)+'”</h1><p class="intro">'+hits.length+(hits.length===1?' command':' commands')+' found.</p></div>'+
    (hits.length?'<ul class="cmds">'+shown.map(function(h){return cmdHtml(h[0],h[1],true)}).join("")+'</ul>'+(hits.length>cap?'<p class="cap">Showing the first '+cap+'. Add another word to narrow it down.</p>':''):
    '<p class="empty">Nothing matches. Try a shorter word, like “ban” or “voice”.</p>');
}
function route(){
  stopDemo();
  var slug=location.hash.replace(/^#/,"");
  state.cat=slug&&catByslug(slug)?slug:null;
  if(state.q)renderSearch(state.q);
  else if(state.cat)renderCat(catByslug(state.cat));
  else renderHome();
  renderSide();
  $("side").classList.remove("open");$("menu-btn").setAttribute("aria-expanded","false");
  document.title=(state.q?"Search":state.cat?catByslug(state.cat).name:"Commands")+" · "+DATA.bot;
}

/* ---------- live demo (typing animation) ---------- */
var demoTimer=null, demoOn=false;
var DEMO=[
 {type:"-backup add Night Crew",out:[["b",null,"Backup success `1a4b-2ca1`"]]},
 {type:"-backup list",out:[["b","embed","Saved backups","`1a4b-2ca1` **Night Crew** - 24 roles, 6 categories, 31 channels - 2 minutes ago"]]},
 {type:"-backup load 1a4b-2ca1",out:[["b",null,"Loading the backup, this can take a few minutes..."]]}
];
function stopDemo(){demoOn=false;clearTimeout(demoTimer)}
function startDemo(){
  var log=$("demo-log"),inp=$("demo-in"),typ=$("demo-typing");
  if(!log)return;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){
    log.style.justifyContent="flex-start";
    log.innerHTML=DEMO.slice(0,2).map(function(d){return userMsg(d.type)+sceneHtml(d.out)}).join("");
    return;
  }
  demoOn=true;
  var i=0;
  function wait(ms,fn){demoTimer=setTimeout(function(){if(demoOn)fn()},ms)}
  function trim(){while(log.children.length>4)log.removeChild(log.firstChild)}
  function scene(){
    var d=DEMO[i%DEMO.length],n=0;
    inp.className="compose";inp.innerHTML='<span class="caret"></span>';
    (function type(){
      if(n<d.type.length){
        n++;inp.innerHTML=esc(d.type.slice(0,n))+'<span class="caret"></span>';
        wait(45+Math.random()*50,type);
      }else wait(450,send);
    })();
    function send(){
      inp.className="compose empty";inp.innerHTML="";
      log.insertAdjacentHTML("beforeend",userMsg(d.type));trim();
      typ.textContent=DATA.bot+" is typing…";
      wait(900,function(){
        typ.textContent="";
        log.insertAdjacentHTML("beforeend",sceneHtml(d.out));trim();
        i++;wait(2600,scene);
      });
    }
  }
  scene();
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".see");
  if(!b)return;
  var box=$(b.getAttribute("aria-controls")), open=b.getAttribute("aria-expanded")==="true";
  if(open){box.hidden=true;b.setAttribute("aria-expanded","false");b.textContent="See it in chat";return}
  if(!box.innerHTML)box.innerHTML=previewHtml(REG[box.id]);
  box.hidden=false;b.setAttribute("aria-expanded","true");b.textContent="Hide preview";
});
$("q").addEventListener("input",function(e){
  state.q=e.target.value.trim();
  route();
});
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement!==$("q")&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}
  if(e.key==="Escape"&&document.activeElement===$("q")){$("q").value="";state.q="";route();$("q").blur()}
});
$("home-link").addEventListener("click",function(e){e.preventDefault();$("q").value="";state.q="";if(location.hash){location.hash=""}else route();window.scrollTo(0,0)});
$("menu-btn").addEventListener("click",function(){
  var o=$("side").classList.toggle("open");this.setAttribute("aria-expanded",o?"true":"false");
});
window.addEventListener("hashchange",function(){$("q").value="";state.q="";route();window.scrollTo(0,0)});

/* ---------- boot ---------- */
fetch("commands.json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  DATA=d;$("brand-name").textContent=d.bot;route();
}).catch(function(){
  $("main").innerHTML='<p class="empty">Could not load commands.json. Make sure it is deployed next to index.html.</p>';
});
})();
</script>
</body>
</html>
