<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heal commands</title>
<meta name="description" content="Every Heal command with usage and an example of how it looks in chat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0808; --bg2:#1a0e12; --panel:#1b1013; --panel2:#26151a; --line:rgba(214,96,120,.28);
  --tx:#f5ecee; --mut:#b9a3a9; --pur:#f08aa0; --btn:#6b1a2d; --btn-line:#c9526b; --coral:#e8c48b;
  --d1:#313338; --d2:#2b2d31; --d3:#1e1f22; --dtext:#dbdee1; --dmuted:#949ba4; --blurple:#5865f2;
  --display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --body:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-padding-top:6rem;background:var(--bg)}
body{margin:0;color:var(--tx);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(60rem 32rem at 50% -8rem,rgba(160,40,65,.42),transparent 70%),linear-gradient(180deg,var(--bg) 0%,var(--bg2) 60%,var(--bg) 100%) no-repeat}
a{color:var(--pur)}
:focus-visible{outline:3px solid #ffb3c1;outline-offset:2px;border-radius:6px}
code{font-family:var(--mono);font-size:.88em;background:rgba(240,138,160,.14);padding:.1em .35em;border-radius:5px}

/* floating pill nav */
.nav{position:fixed;top:.9rem;left:50%;transform:translateX(-50%);z-index:30;width:min(1000px,calc(100% - 1.5rem));
  background:rgba(18,9,12,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.06);border-radius:999px;
  padding:.55rem .6rem .55rem 1.1rem;display:flex;align-items:center;gap:1.1rem;box-shadow:0 10px 40px -12px rgba(0,0,0,.7)}
.brand{display:flex;align-items:center;gap:.6rem;font:800 1.3rem/1 var(--display);letter-spacing:-.02em;color:var(--tx);text-decoration:none}
.brand img{width:2rem;height:2rem;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.links{display:flex;gap:1.2rem;margin-left:auto}
.links a{color:#e6d6da;text-decoration:none;font-size:.88rem;font-weight:500}
.links a:hover{color:#fff}
.search{position:relative;width:13rem}
.search input{width:100%;font:inherit;font-size:.86rem;padding:.5rem 2rem .5rem .95rem;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.05);color:var(--tx)}
.search input::placeholder{color:#b49ba2}
.search kbd{position:absolute;right:.65rem;top:50%;transform:translateY(-50%);font:600 .7rem var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:0 .35rem}
.btn{font:600 .9rem var(--body);color:var(--tx);text-decoration:none;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:999px;padding:.6rem 1.2rem;cursor:pointer;display:inline-block}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.primary{background:var(--btn);border-color:var(--btn-line);box-shadow:0 0 22px -4px rgba(201,82,107,.55)}
.btn.primary:hover{background:#8a2339}
.nav .btn{padding:.5rem 1rem;font-size:.85rem}
.menu-btn{display:none}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:6.2rem 1.25rem 0;display:grid;grid-template-columns:15.5rem minmax(0,1fr);gap:2.5rem}
body.is-home .wrap{display:block;max-width:1240px}
body.is-home .side{display:none}
.side{position:sticky;top:5.6rem;align-self:start;max-height:calc(100vh - 6.5rem);overflow:auto;padding:0 0 2rem}
.side h2{font:600 .8rem var(--body);color:var(--mut);margin:0 0 .5rem .7rem}
.side a{display:flex;justify-content:space-between;gap:.5rem;padding:.4rem .7rem;border-radius:10px;color:#e6d6da;text-decoration:none;font-size:.92rem}
.side a:hover{background:rgba(255,255,255,.05)}
.side a[aria-current=page]{background:var(--btn);color:#fff;box-shadow:inset 0 0 0 1px var(--btn-line)}
.side a span{color:var(--mut);font-size:.82rem;font-variant-numeric:tabular-nums}
main{padding:0 0 5rem;min-width:0}

/* hero */
.hero{text-align:center;padding:1.5rem 0 2.6rem}
.hero h1{font:600 clamp(2.2rem,5vw,3.5rem)/1.1 var(--display);letter-spacing:-.025em;margin:0 0 .9rem}
.hero p{margin:0 auto 1.6rem;color:#e3d3d7;max-width:38rem;font-size:1.05rem}
.cta{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}

/* showcase */
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.5rem;perspective:1900px;position:relative;min-height:34rem;
  -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);mask-image:linear-gradient(to bottom,#000 72%,transparent 100%)}
.help-win{transform:rotateY(15deg) rotateX(5deg) rotateZ(-2deg);transform-origin:0% 50%;align-self:start;margin-top:1rem;
  border:1px solid var(--line);border-radius:22px;box-shadow:0 0 50px -12px rgba(201,82,107,.5);overflow:hidden;background:var(--d1)}
.phones{position:relative;perspective:1300px;min-height:32rem}
.phone{position:absolute;width:12.5rem;height:24rem;border-radius:26px;padding:1rem .9rem;text-decoration:none;color:var(--tx);overflow:hidden;
  background:linear-gradient(180deg,#2a1218,#170a0d);border:1px solid var(--btn-line);box-shadow:0 0 40px -10px rgba(201,82,107,.55);display:flex;flex-direction:column;gap:.55rem}
.phone:hover{border-color:#ffc2cf}
.phone.a{left:0;top:2.6rem;transform:rotateY(-24deg) rotateZ(2deg) scale(.94);z-index:1}
.phone.b{left:8.6rem;top:.6rem;transform:rotateY(-22deg) rotateZ(1.5deg);z-index:2}
.phone.c{left:17.2rem;top:3.6rem;transform:rotateY(-20deg) rotateZ(1deg);z-index:3}
.ph-av{width:3.6rem;height:3.6rem;border-radius:50%;object-fit:cover;border:2px solid var(--btn-line);margin:.2rem auto 0;display:block}
.ph-name{text-align:center;font:700 1.15rem/1.1 var(--display)}
.ph-sub{text-align:center;color:var(--mut);font-size:.78rem;margin-top:-.35rem}
.ph-row{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:.45rem .6rem;font:600 .72rem var(--mono);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ph-row .pfx{color:var(--pur)}
.ph-row .ph{color:var(--coral);font-weight:400}
.ph-more{margin-top:auto;text-align:center;font-size:.78rem;color:var(--pur);font-weight:600}

/* discord-style chat */
.chat{background:var(--d1);color:var(--dtext);border-radius:12px;overflow:hidden;font:400 .95rem/1.4 "gg sans","Segoe UI",system-ui,sans-serif;border:1px solid var(--line)}
.help-win.chat{border-radius:22px}
.chat-bar{background:var(--d2);padding:.6rem 1rem;font-weight:600;border-bottom:1px solid var(--d3);color:#f2f3f5}
.chat-bar span{color:var(--dmuted);font-weight:400;margin-right:.3rem}
.log{padding:.9rem 1rem;display:flex;flex-direction:column;gap:.9rem}
.msg{display:grid;grid-template-columns:2.4rem 1fr;gap:.75rem}
.av{width:2.4rem;height:2.4rem;border-radius:50%;object-fit:cover}
.who{font-weight:600;color:#f2f3f5}
.who small{font-weight:400;color:var(--dmuted);font-size:.75rem;margin-left:.4rem}
.badge{background:var(--blurple);color:#fff;font:700 .62rem/1 sans-serif;padding:.18rem .3rem;border-radius:4px;margin-left:.35rem;vertical-align:.12em}
.body{min-width:0;overflow-wrap:anywhere}
.body code{background:var(--d3);color:#e3e5e8;padding:.08em .32em}
.mention{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:4px;padding:0 .15em}
.embed{margin-top:.3rem;background:var(--d2);border-left:4px solid #b03048;border-radius:4px;padding:.6rem .8rem;max-width:30rem}
.embed b.t{display:block;color:#f2f3f5;margin-bottom:.15rem}
.narr{color:var(--dmuted);font-size:.82rem;text-align:center;font-style:italic}
.typing{color:var(--dmuted);font-size:.78rem;height:1rem;padding:0 1rem}
.compose{margin:0 1rem 1rem;background:#383a40;border-radius:8px;padding:.65rem .9rem;color:#f2f3f5;min-height:2.5rem;font-family:var(--mono);font-size:.86rem;overflow:hidden;white-space:nowrap}
.compose.empty::before{content:"Message #general";color:#8e9297;font-family:"gg sans","Segoe UI",system-ui,sans-serif;font-size:.92rem}
.caret{display:inline-block;width:2px;height:1em;background:#f2f3f5;vertical-align:-.12em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* help menu mock */
.hcont{margin-top:.3rem;background:var(--d2);border-radius:8px;padding:.8rem .9rem;max-width:34rem}
.hscroll{max-height:15.5rem;overflow:auto;padding-right:.3rem}
.hcont h4{margin:0 0 .35rem;font:700 1.15rem var(--display);color:#fff}
.hcont h5{margin:.7rem 0 .25rem;font:700 .95rem var(--display);color:#fff}
.hcont p{margin:.1rem 0;font-size:.88rem}
.hcats{list-style:none;margin:0;padding:0;columns:2;font-size:.86rem;font-weight:600}
.hcats li{margin:.1rem 0}
.hcats button{all:unset;cursor:pointer;color:#dbdee1}
.hcats button:hover{text-decoration:underline}
.hline{font-size:.84rem;margin:.18rem 0;color:#c9ccd1}
.hline code{color:#fff}
.hmore{font-size:.82rem;color:#ffb3c1;margin-top:.5rem}
.hsel{margin-top:.7rem;display:block;width:100%;font:inherit;font-size:.88rem;background:var(--d3);color:#dbdee1;border:1px solid #3f4147;border-radius:6px;padding:.5rem .6rem}

/* home list */
.home h2,.sect h2{font:700 1.5rem/1.15 var(--display);letter-spacing:-.02em;margin:0 0 1rem}
.home{margin-top:1.5rem}
.catlist{list-style:none;margin:0;padding:0;columns:2 22rem;column-gap:3rem}
.catlist li{break-inside:avoid;border-top:1px solid var(--line);padding:.85rem 0}
.catlist a{font:700 1.1rem var(--display);color:var(--tx);text-decoration:none}
.catlist a:hover{color:var(--pur)}
.catlist .n{color:var(--mut);font-size:.85rem;margin-left:.4rem}
.catlist p{margin:.15rem 0 0;color:var(--mut);font-size:.92rem}

/* category + commands */
.cat-head h1{font:700 clamp(2rem,4vw,2.8rem)/1.05 var(--display);letter-spacing:-.03em;margin:0 0 .6rem}
.need{display:inline-block;background:rgba(240,138,160,.14);border:1px solid var(--line);border-radius:999px;padding:.25rem .8rem;font-size:.88rem;margin:0 0 .8rem}
.intro{max-width:46rem;color:#dcc9ce;margin:0 0 .5rem}
.sect{margin-top:2.2rem}
.sect h2{font-size:1.25rem;margin-bottom:.4rem}
.sect .req{font-size:.9rem;color:var(--mut);margin:0 0 .6rem}
.sect .note{color:#dcc9ce;font-size:.93rem;margin:.2rem 0;max-width:46rem}
.cmds{list-style:none;margin:.6rem 0 0;padding:0}
.cmd{border-top:1px solid var(--line);padding:.85rem 0}
.cmd-top{display:flex;gap:1rem;align-items:flex-start;justify-content:space-between}
.usages{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin-bottom:.25rem}
.u{font:600 .9rem var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.15rem .55rem;overflow-wrap:anywhere}
.u .pfx{color:var(--pur)}
.u .ph{color:var(--coral);font-weight:400}
.desc{margin:0;max-width:46rem;color:#efe1e4}
.see{flex:none;font:600 .82rem var(--body);color:#ffdbe3;background:none;border:1px solid var(--line);border-radius:999px;padding:.32rem .85rem;cursor:pointer}
.see:hover{background:rgba(255,255,255,.07)}
.see[aria-expanded=true]{background:var(--btn);border-color:var(--btn-line);color:#fff}
.preview{margin-top:.7rem;max-width:38rem}
.preview[hidden]{display:none}
.cap{font-size:.82rem;color:var(--mut);margin:.4rem 0 0}
.tag{font-size:.78rem;color:var(--mut);margin-left:.2rem}
.empty{padding:2rem 0;color:var(--mut)}

@media (max-width:900px){
  .links{display:none}
  .search{width:auto;flex:1;margin-left:auto}
  .search kbd{display:none}
  .nav .btn.primary{display:none}
  .menu-btn{display:inline-block}
  body.is-home .menu-btn{display:none}
  .wrap{grid-template-columns:1fr;gap:0}
  .side{display:none;position:static;max-height:none;padding:0 0 1rem}
  .side.open{display:block}
  .stage{grid-template-columns:1fr;min-height:0;perspective:none;-webkit-mask-image:none;mask-image:none}
  .help-win{transform:none}
  .phones{display:flex;gap:.8rem;overflow-x:auto;min-height:0;padding:1rem 0;transform-style:flat}
  .phone,.phone.a,.phone.b,.phone.c{position:static;transform:none;flex:none;opacity:1}
  .cmd-top{flex-direction:column;gap:.5rem}
}
@media (prefers-reduced-motion:reduce){.caret{animation:none}}
</style>
</head>
<body class="is-home">
<header class="nav">
  <a class="brand" href="#" id="home-link"><img src="bot-avatar.png" alt=""><span id="brand-name">Heal</span></a>
  <nav class="links" aria-label="Quick links">
    <a href="#moderation">Moderation</a>
    <a href="#antinuke">AntiNuke</a>
    <a href="#voicemaster">VoiceMaster</a>
    <a href="#general">Help</a>
  </nav>
  <label class="search">
    <span style="position:absolute;left:-9999px">Search commands</span>
    <input id="q" type="search" placeholder="Search commands" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <button class="btn menu-btn" id="menu-btn" aria-expanded="false" aria-controls="side">Categories</button>
  <a class="btn primary" href="#" id="browse-top">Browse commands</a>
</header>

<div class="wrap">
  <nav class="side" id="side" aria-label="Command categories"></nav>
  <main id="main" tabindex="-1"><p class="empty">Loading commands…</p></main>
</div>

<script>
(function(){
"use strict";
var DATA=null, REG={}, state={cat:null,q:""};

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function md(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}
function mentions(s){return s.replace(/(@\w+|#[a-z][\w-]*)/g,function(m){return '<span class="mention">'+m+'</span>'})}
function $(id){return document.getElementById(id)}
var SAMPLES={user:"@Alex",member:"@Alex",target:"@Alex",channel:"#general",role:"@Moderator",name:"Night Crew",code:"1a4b-2ca1",
  reason:"spamming",time:"10m",duration:"10m",amount:"5",number:"5",count:"5",n:"5",limit:"5",threshold:"3",text:"hello everyone",
  message:"hello everyone",msg:"hello everyone",url:"example.com/image.png",slot:"1",category:"Voice",emoji:"🔥",prize:"Nitro",
  winners:"1",level:"10",color:"#1c7c6e",colour:"#1c7c6e",id:"123456789"};
function fill(u,pfx){
  var s=u.replace(/\[[^\]]*\]/g,"").replace(/<([^>]+)>/g,function(m,inner){
    var k=inner.split("/")[0].trim().toLowerCase().replace(/\s+/g,"");
    if(k==="message"&&/^giveaway/.test(u))return "1234567890";
    return SAMPLES[k]||k});
  s=s.replace(/@user\b/gi,"@Alex").replace(/@role\b/gi,"@Moderator").replace(/#channel\b/gi,"#general").replace(/\b([a-z]+)\/[a-z/]+\b/gi,"$1");
  return pfx+s.replace(/\s+/g," ").trim();
}
function usageHtml(u,pfx){
  var parts=esc(u).replace(/(&lt;[^&]*?&gt;|\[[^\]]*\])/g,'<span class="ph">$1</span>');
  return '<span class="u"><span class="pfx">'+esc(pfx)+'</span>'+parts+'</span>';
}

/* ---------- chat rendering ---------- */
function userMsg(text){return '<div class="msg"><img class="av" src="avatar.png" alt=""><div class="body"><div class="who">mycliq<small>Today at 4:12 PM</small></div>'+mentions(esc(text))+'</div></div>'}
function botMsg(inner){return '<div class="msg"><img class="av" src="bot-avatar.png" alt=""><div class="body"><div class="who">'+esc(DATA?DATA.bot:"Heal")+'<span class="badge">APP</span><small>Today at 4:12 PM</small></div>'+inner+'</div></div>'}
function embed(title,text){return '<div class="embed"><b class="t">'+esc(title)+'</b>'+md(text)+'</div>'}
function narr(t){return '<div class="narr">'+esc(t)+'</div>'}

/* Replies copied from the bot's code (cogs/backup.py and cogs/moderation.py). */
var REAL_SCENES={
 "backup add":[["u","-backup add Night Crew"],["b",null,"Backup success `1a4b-2ca1`"]],
 "backup list":[["u","-backup list"],["b","embed","Saved backups","`1a4b-2ca1` **Night Crew** - 24 roles, 6 categories, 31 channels - 2 minutes ago"]],
 "backup load":[["u","-backup load 1a4b-2ca1"],["n","Heal asks you to type yes to confirm."],["u","yes"],["b",null,"Loading the backup, this can take a few minutes..."],["n","When it finishes, in the first new text channel:"],["b",null,"Backup loaded"]],
 "nuke":[["u","-nuke"],["n","Heal asks you to type yes or cancel."],["u","yes"],["n","The channel is deleted and recreated, then:"],["b",null,"first"]]
};
function sceneHtml(steps){
  return steps.map(function(s){
    if(s[0]==="u")return userMsg(s[1]);
    if(s[0]==="n")return narr(s[1]);
    return botMsg(s[1]==="embed"?embed(s[2],s[3]):md(s[2]));
  }).join("");
}
function realKey(c){
  var u=c.usages[0].replace(/[<\[].*$/,"").trim();
  return REAL_SCENES[u]?u:null;
}
function previewHtml(c,catName){
  var k=realKey(c), body, cap;
  if(k){body=sceneHtml(REAL_SCENES[k]);cap="Reply text comes from the bot's code."}
  else{
    var u=c.usages[0], typed=fill(u,DATA.prefix);
    var title=DATA.prefix+u.replace(/[<\[].*$/,"").trim();
    body=userMsg(typed)+botMsg(embed(title,c.desc||"Runs "+title+"."));
    cap="Example only. It shows what to type and what the command does; the real reply may look different."
  }
  return '<div class="chat"><div class="chat-bar"><span>#</span>general</div><div class="log">'+body+'</div></div><p class="cap">'+esc(cap)+'</p>';
}

/* ---------- views ---------- */
function catByslug(s){return DATA.categories.filter(function(c){return c.slug===s})[0]}
function total(){return DATA.categories.reduce(function(n,c){return n+c.count},0)}

function renderSide(){
  $("side").innerHTML='<h2>Categories</h2>'+DATA.categories.map(function(c){
    return '<a href="#'+c.slug+'"'+(state.cat===c.slug&&!state.q?' aria-current="page"':'')+'>'+esc(c.name)+'<span>'+c.count+'</span></a>';
  }).join("");
}
function cmdHtml(c,catName,withTag){
  var id="p"+Math.random().toString(36).slice(2,9);
  REG[id]=c;
  return '<li class="cmd"><div class="cmd-top"><div><div class="usages">'+
    c.usages.map(function(u){return usageHtml(u,DATA.prefix)}).join("")+
    (withTag?'<span class="tag">'+esc(catName)+'</span>':'')+'</div>'+
    (c.desc?'<p class="desc">'+md(c.desc)+'</p>':'')+'</div>'+
    '<button class="see" aria-expanded="false" aria-controls="'+id+'">See it in chat</button></div>'+
    '<div class="preview" id="'+id+'" hidden></div></li>';
}
function flat(c){var o=[];c.sections.forEach(function(s){s.commands.forEach(function(x){o.push(x)})});return o}
function pick(c,names){
  var all=flat(c),out=[];
  names.forEach(function(n){
    for(var i=0;i<all.length;i++){if(all[i].usages[0].split(/\s/)[0]===n&&out.indexOf(all[i])<0){out.push(all[i]);break}}
  });
  for(var j=0;j<all.length&&out.length<4;j++){if(out.indexOf(all[j])<0)out.push(all[j])}
  return out.slice(0,4);
}
function phone(slug,cls,names){
  var c=catByslug(slug);if(!c)return "";
  return '<a class="phone '+cls+'" href="#'+c.slug+'" aria-label="Open '+esc(c.name)+' commands">'+
    '<img class="ph-av" src="bot-avatar.png" alt=""><div class="ph-name">'+esc(c.name)+'</div><div class="ph-sub">'+c.count+' commands</div>'+
    pick(c,names).map(function(x){return '<div class="ph-row" title="'+esc(x.desc)+'">'+usageHtml(x.usages[0],DATA.prefix)+'</div>'}).join("").replace(/class="u"/g,'class="pu"')+
    '<div class="ph-more">View all commands</div></a>';
}
function helpPage(page){
  var pfx=DATA.prefix;
  if(page==="overview"){
    return '<div class="hscroll"><h4>Bot Overview</h4><p><strong>Bot:</strong> '+esc(DATA.bot)+'</p><p><strong>Prefix:</strong> '+esc(pfx)+'</p>'+
      '<h5>Categories</h5><ul class="hcats">'+DATA.categories.map(function(c){return '<li><button data-help="'+c.slug+'">'+esc(c.name)+'</button></li>'}).join("")+'</ul></div>';
  }
  var c=catByslug(page),n=0,max=18,h='<div class="hscroll"><h4>'+esc(c.name)+'</h4>';
  if(c.required)h+='<p><strong>Required:</strong> '+md(c.required)+'</p>';
  c.intro.slice(0,1).forEach(function(t){h+='<p>'+md(t)+'</p>'});
  outer:for(var i=0;i<c.sections.length;i++){
    var sct=c.sections[i];h+='<h5>'+esc(sct.title)+'</h5>';
    for(var j=0;j<sct.commands.length;j++){
      if(n>=max)break outer;
      var x=sct.commands[j];n++;
      h+='<div class="hline"><code>'+esc(pfx+x.usages[0])+'</code>'+(x.desc?' - '+md(x.desc):'')+'</div>';
    }
  }
  if(c.count>n)h+='<p class="hmore"><a href="#'+c.slug+'">See all '+c.count+' commands</a></p>';
  return h+'</div>';
}
function helpHtml(page){
  return '<div class="hcont" id="helpbox">'+helpPage(page)+
    '<select class="hsel" id="helpsel" aria-label="Choose a category"><option value="overview">Choose a category</option>'+
    DATA.categories.map(function(c){return '<option value="'+c.slug+'"'+(c.slug===page?' selected':'')+'>'+esc(c.name)+'</option>'}).join("")+'</select></div>';
}
function showHelp(page){
  var box=$("helpbox");if(!box)return;
  box.outerHTML=helpHtml(page);
  if(page==="overview")$("helpsel").value="overview";
}
function renderHome(){
  var n=total();
  $("main").innerHTML=
   '<section class="hero"><h1>Everything '+esc(DATA.bot)+' can do, right here.</h1>'+
   '<p>'+n+' commands in '+DATA.categories.length+' categories. Browse them, search them, and see how each one looks in chat.</p>'+
   '<div class="cta"><a class="btn primary" href="#" id="browse">Browse commands</a><button class="btn" id="search-btn" type="button">Search commands</button></div></section>'+
   '<section class="stage" aria-label="Preview of the help menu and popular categories">'+
   '<div class="help-win chat"><div class="chat-bar"><span>#</span>general</div><div class="log" id="demo-log" style="min-height:22rem;justify-content:flex-start"></div>'+
   '<div class="typing" id="demo-typing"></div><div class="compose empty" id="demo-in"></div></div>'+
   '<div class="phones">'+phone("moderation","a",["ban","kick","mute","purge"])+phone("voicemaster","b",["vm"])+phone("antinuke","c",["antinuke"])+'</div></section>'+
   '<section class="home" id="cats"><h2>Browse by category</h2><ul class="catlist">'+DATA.categories.map(function(c){
     return '<li><a href="#'+c.slug+'">'+esc(c.name)+'</a><span class="n">'+c.count+' commands</span>'+(c.intro[0]?'<p>'+md(c.intro[0])+'</p>':'')+'</li>';
   }).join("")+'</ul></section>';
  startDemo();
}
function renderCat(c){
  var h='<div class="cat-head"><h1>'+esc(c.name)+'</h1>'+(c.required?'<div class="need">Needs: '+md(c.required)+'</div>':'')+
        c.intro.map(function(t){return '<p class="intro">'+md(t)+'</p>'}).join("")+'</div>';
  h+=c.sections.map(function(s){
    return '<section class="sect"><h2>'+esc(s.title)+'</h2>'+(s.required?'<p class="req">Needs: '+md(s.required)+'</p>':'')+
      s.notes.map(function(t){return '<p class="note">'+md(t)+'</p>'}).join("")+
      '<ul class="cmds">'+s.commands.map(function(x){return cmdHtml(x,c.name,false)}).join("")+'</ul></section>';
  }).join("");
  $("main").innerHTML=h;
}
function renderSearch(q){
  var terms=q.toLowerCase().split(/\s+/).filter(Boolean), hits=[];
  DATA.categories.forEach(function(c){c.sections.forEach(function(s){s.commands.forEach(function(x){
    var hay=(x.usages.join(" ")+" "+x.desc+" "+c.name+" "+s.title).toLowerCase();
    if(terms.every(function(t){return hay.indexOf(t)>-1})){
      var first=x.usages[0].toLowerCase(), uh=x.usages.join(" ").toLowerCase();
      var score=first.indexOf(terms[0])===0?0:(uh.indexOf(terms[0])>-1?1:2);
      hits.push([x,c.name,score]);
    }
  })})});
  hits.sort(function(a,b){return a[2]-b[2]});
  var cap=100, shown=hits.slice(0,cap);
  $("main").innerHTML='<div class="cat-head"><h1>Results for “'+esc(q)+'”</h1><p class="intro">'+hits.length+(hits.length===1?' command':' commands')+' found.</p></div>'+
    (hits.length?'<ul class="cmds">'+shown.map(function(h){return cmdHtml(h[0],h[1],true)}).join("")+'</ul>'+(hits.length>cap?'<p class="cap">Showing the first '+cap+'. Add another word to narrow it down.</p>':''):
    '<p class="empty">Nothing matches. Try a shorter word, like “ban” or “voice”.</p>');
}
function route(){
  stopDemo();
  var slug=location.hash.replace(/^#/,"");
  state.cat=slug&&catByslug(slug)?slug:null;
  if(state.q)renderSearch(state.q);
  else if(state.cat)renderCat(catByslug(state.cat));
  else renderHome();
  document.body.classList.toggle("is-home",!state.q&&!state.cat);
  renderSide();
  $("side").classList.remove("open");$("menu-btn").setAttribute("aria-expanded","false");
  document.title=(state.q?"Search":state.cat?catByslug(state.cat).name:"Commands")+" · "+DATA.bot;
}

/* ---------- help demo (types -help, then shows the menu) ---------- */
var demoTimer=null, demoOn=false;
function stopDemo(){demoOn=false;clearTimeout(demoTimer)}
function startDemo(){
  var log=$("demo-log"),inp=$("demo-in"),typ=$("demo-typing");
  if(!log)return;
  var cmd=DATA.prefix+"help";
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function finish(){log.innerHTML=userMsg(cmd)+botMsg(helpHtml("overview"))}
  if(reduce){finish();return}
  demoOn=true;var n=0;
  function wait(ms,fn){demoTimer=setTimeout(function(){if(demoOn)fn()},ms)}
  inp.className="compose";inp.innerHTML='<span class="caret"></span>';
  wait(700,function type(){
    if(n<cmd.length){n++;inp.innerHTML=esc(cmd.slice(0,n))+'<span class="caret"></span>';wait(110,type)}
    else wait(450,function(){
      inp.className="compose empty";inp.innerHTML="";
      log.innerHTML=userMsg(cmd);typ.textContent=DATA.bot+" is typing…";
      wait(800,function(){typ.textContent="";finish()});
    });
  });
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".see");
  if(!b)return;
  var box=$(b.getAttribute("aria-controls")), open=b.getAttribute("aria-expanded")==="true";
  if(open){box.hidden=true;b.setAttribute("aria-expanded","false");b.textContent="See it in chat";return}
  if(!box.innerHTML)box.innerHTML=previewHtml(REG[box.id]);
  box.hidden=false;b.setAttribute("aria-expanded","true");b.textContent="Hide preview";
});
document.addEventListener("click",function(e){
  var h=e.target.closest&&e.target.closest("[data-help]");
  if(h){showHelp(h.getAttribute("data-help"));return}
  if(e.target.id==="browse"||e.target.id==="browse-top"){
    e.preventDefault();
    if(!document.body.classList.contains("is-home")){$("q").value="";state.q="";location.hash="";}
    setTimeout(function(){var c=$("cats");if(c)c.scrollIntoView({behavior:"smooth"})},60);
  }
  if(e.target.id==="search-btn"){$("q").focus()}
});
document.addEventListener("change",function(e){if(e.target.id==="helpsel")showHelp(e.target.value)});
$("q").addEventListener("input",function(e){
  state.q=e.target.value.trim();
  route();
});
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement!==$("q")&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}
  if(e.key==="Escape"&&document.activeElement===$("q")){$("q").value="";state.q="";route();$("q").blur()}
});
$("home-link").addEventListener("click",function(e){e.preventDefault();$("q").value="";state.q="";if(location.hash){location.hash=""}else route();window.scrollTo(0,0)});
$("menu-btn").addEventListener("click",function(){
  var o=$("side").classList.toggle("open");this.setAttribute("aria-expanded",o?"true":"false");
});
window.addEventListener("hashchange",function(){$("q").value="";state.q="";route();window.scrollTo(0,0)});

/* ---------- boot ---------- */
fetch("commands.json").then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){
  DATA=d;$("brand-name").textContent=d.bot;route();
}).catch(function(){
  $("main").innerHTML='<p class="empty">Could not load commands.json. Make sure it is deployed next to index.html.</p>';
});
})();
</script>
</body>
</html>
